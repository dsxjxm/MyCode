<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网络模拟 - 局域网仿真实训教学平台</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    body { margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    .net-layout { flex: 1; display: flex; overflow: hidden; }

    /* ===== 左侧配置面板 ===== */
    .net-sidebar { width: 320px; min-width: 280px; background: #f7f8fa; border-right: 1px solid #e5e7eb;
                   overflow-y: auto; padding: 12px 14px; font-size: 13px; }
    .net-sidebar h3 { margin: 8px 0 6px; font-size: 14px; color: #1f2937;
                      border-left: 3px solid #2563eb; padding-left: 8px; }
    .net-sidebar .field { margin-bottom: 6px; }
    .net-sidebar label { display: block; color: #6b7280; font-size: 12px; margin-bottom: 2px; }
    .net-sidebar input, .net-sidebar select { width: 100%; box-sizing: border-box; padding: 5px 7px;
                border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; background: #fff; }
    .net-sidebar input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.1); }
    .net-sidebar .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .net-sidebar .btn { padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; }
    .net-sidebar .btn-primary { background: #2563eb; color: #fff; }
    .net-sidebar .btn-primary:hover { background: #1d4ed8; }
    .net-sidebar .btn-sm { padding: 3px 7px; font-size: 11px; }
    .net-sidebar .btn-danger { background: #ef4444; color: #fff; }
    .net-sidebar .btn-success { background: #10b981; color: #fff; }
    .net-sidebar .section { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px;
                            padding: 10px; margin-bottom: 12px; }
    .net-sidebar .section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .net-sidebar .section-title h4 { margin: 0; font-size: 13px; color: #374151; }

    .dns-list-item { display: flex; align-items: center; gap: 6px; padding: 4px 6px;
                     border: 1px solid #f3f4f6; border-radius: 4px; margin-bottom: 4px; font-size: 12px; }
    .dns-tag { font-size: 10px; padding: 1px 5px; border-radius: 9px; font-weight: 600;
               background: #dbeafe; color: #1e40af; }
    .dns-tag.cname { background: #fef3c7; color: #92400e; }
    .dns-tag.ns { background: #dcfce7; color: #166534; }
    .dns-tag.mx { background: #fce7f3; color: #9d174d; }

    .pc-card { padding: 6px 8px; border: 1px solid #e5e7eb; border-radius: 4px; margin-bottom: 4px;
               font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
    .pc-card.online { border-color: #10b981; background: #ecfdf5; }
    .pc-card .pc-info { flex: 1; }
    .pc-card .pc-status { font-size: 10px; padding: 1px 6px; border-radius: 9px; }
    .pc-card.online .pc-status { background: #d1fae5; color: #065f46; }
    .pc-card.offline .pc-status { background: #f3f4f6; color: #6b7280; }

    /* 学生可见左侧面板，但为只读（隐藏保存/新增/删除，禁用输入） */
    .net-student-view .net-sidebar button { display: none; }
    .net-student-view .net-sidebar input,
    .net-student-view .net-sidebar select { background: #f3f4f6; color: #6b7280; pointer-events: none; }

    /* ===== 中间：SVG 拓扑画布 ===== */
    .net-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fafbfc; }

    .topo-wrap { flex: 1; overflow: hidden; position: relative; }
    .topo-svg { width: 100%; height: 100%; background:
                radial-gradient(circle at 20% 20%, #f0f4ff 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, #f0fdf4 0%, transparent 60%);
               display: block; }

    .node-group { cursor: grab; }
    .node-group:active { cursor: grabbing; }
    .node-group.server { cursor: default; }
    .node-group.offline { opacity: .72; }
    .node-group:hover .node-body { filter: drop-shadow(0 4px 8px rgba(0,0,0,.22)); }

    .node-body { filter: drop-shadow(0 2px 3px rgba(0,0,0,.12)); }
    .node-body rect.server { fill: linear-gradient(#1e40af, #2563eb); }

    .link-line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; transition: stroke .2s; }
    .link-line.active { stroke: #10b981; stroke-dasharray: none; stroke-width: 2; }

    .node-status-dot { }
    .node-status-dot.online { fill: #10b981; }
    .node-status-dot.offline { fill: #9ca3af; }

    /* 提示：点击节点切换在线状态 */
    .topo-hint { position: absolute; top: 10px; right: 14px; font-size: 11px;
                 color: #6b7280; background: #fff; padding: 4px 8px; border-radius: 4px;
                 border: 1px solid #e5e7eb; }

    /* ===== 底部命令终端 ===== */
    .net-terminal { height: 220px; min-height: 180px; background: #0d1117; color: #e6edf3;
                    display: flex; flex-direction: column; border-top: 2px solid #2563eb; }
    .net-term-head { display: flex; justify-content: space-between; align-items: center;
                     padding: 4px 12px; background: #161b22; border-bottom: 1px solid #30363d; }
    .net-term-head .title { font-size: 12px; color: #8b949e; }
    .net-term-head select { background: #21262d; color: #e6edf3; border: 1px solid #30363d;
                            border-radius: 3px; padding: 2px 6px; font-size: 12px; }
    .net-term-head .hint { font-size: 11px; color: #6e7681; }
    .net-term-body { flex: 1; overflow-y: auto; padding: 8px 12px; font-family: 'Consolas', 'Menlo', monospace;
                     font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-all; }
    .net-term-body .cmd-line { color: #58a6ff; }
    .net-term-body .err { color: #ff7b72; }
    .net-term-input { display: flex; padding: 4px 12px 8px; gap: 8px; }
    .net-term-input .prompt { color: #7ee787; font-family: monospace; font-size: 12.5px; padding: 3px 0; }
    .net-term-input input { flex: 1; background: transparent; border: none; outline: none;
                            color: #e6edf3; font-family: 'Consolas','Menlo',monospace; font-size: 12.5px; }

    /* 没有左侧栏时，让终端宽度占满 */
    .net-student-view .net-terminal { border-top: 2px solid #2563eb; }
  </style>
</head>
<body>
  <!-- 顶部栏 -->
  <header class="topbar topbar-compact">
    <div class="brand">
      <span class="logo-badge small">LAN</span>
      <span class="brand-name">局域网仿真实训教学平台</span>
    </div>
    <nav class="mode-tab">
      <a href="/workspace.html">WWW 实训</a>
      <a href="/terminal.html">FTP / Telnet</a>
      <a href="/network.html" class="active">DNS / DHCP</a>
      <a href="/mail.html">邮件服务器</a>
    </nav>
    <div class="topbar-right">
      <span class="user-chip" id="userChip"></span>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button">退出</button>
    </div>
  </header>

  <div class="net-layout" id="netLayout">
    <!-- 左侧配置面板 -->
    <aside class="net-sidebar" id="netSidebar">
      <!-- DHCP 配置 -->
      <div class="section">
        <div class="section-title"><h4>🔧 DHCP 服务器</h4><span class="dns-tag">SERVER</span></div>
        <div class="row2">
          <div class="field"><label>服务器 IP</label><input id="dhcp_server_ip"></div>
          <div class="field"><label>子网掩码</label><input id="dhcp_subnet"></div>
        </div>
        <div class="row2">
          <div class="field"><label>网关</label><input id="dhcp_gateway"></div>
          <div class="field"><label>DNS 服务器</label><input id="dhcp_dns"></div>
        </div>
        <div class="row2">
          <div class="field"><label>地址池起始</label><input id="dhcp_pool_start"></div>
          <div class="field"><label>地址池结束</label><input id="dhcp_pool_end"></div>
        </div>
        <div class="row2">
          <div class="field"><label>租期（秒）</label><input id="dhcp_lease" type="number"></div>
          <div style="display:flex; align-items:flex-end; justify-content:flex-end;">
            <button class="btn btn-primary" id="dhcpSave">💾 保存</button>
          </div>
        </div>
      </div>

      <!-- DNS 记录 -->
      <div class="section">
        <div class="section-title"><h4>📋 DNS 记录</h4>
          <button class="btn btn-sm btn-primary" id="dnsAddBtn">+ 新增</button></div>
        <div id="dnsRecords"></div>
      </div>

      <!-- PC 列表 -->
      <div class="section">
        <div class="section-title"><h4>🖥️ PC 列表</h4>
          <button class="btn btn-sm btn-primary" id="pcAddBtn">+ 新增</button></div>
        <div id="pcList"></div>
      </div>
    </aside>

    <!-- 右侧：拓扑 + 终端 -->
    <main class="net-main">
      <!-- SVG 画布 -->
      <div class="topo-wrap">
        <div class="topo-hint">💡 拖放 PC 节点调整位置 · 点击节点切换在线状态</div>
        <svg class="topo-svg" id="topoSvg" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
              <feOffset dx="0" dy="2" result="offsetblur"/>
              <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
              <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <linearGradient id="serverGrad" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#1e40af"/>
              <stop offset="100%" stop-color="#2563eb"/>
            </linearGradient>
            <linearGradient id="pcGrad" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#475569"/>
              <stop offset="100%" stop-color="#64748b"/>
            </linearGradient>
          </defs>
          <!-- 连线组 -->
          <g id="topoLinks"></g>
          <!-- 节点组 -->
          <g id="topoNodes"></g>
        </svg>
      </div>

      <!-- 命令终端 -->
      <div class="net-terminal">
        <div class="net-term-head">
          <span class="title">💻 命令提示符（CMD）</span>
          <div style="display:flex; gap:10px; align-items:center;">
            <select id="termPcSelect"><option value="">请先让 PC 上线</option></select>
            <span class="hint">↑↓ 翻历史 · help 查看命令</span>
          </div>
        </div>
        <div class="net-term-body" id="termBody"></div>
        <div class="net-term-input">
          <span class="prompt" id="termPrompt">PC> </span>
          <input id="termInput" autofocus autocomplete="off" spellcheck="false">
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/js/network.js"></script>
</body>
</html>
